<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الصفحة مش موجودة | شريف السيسي</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#2B2B2E">
<meta name="color-scheme" content="dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#2B2B2E;
    --surface:#3A3A3E;
    --line:#4A4A4E;
    --text:#F5F5F5;
    --text-muted:#B5B5B8;
    --accent:#FF2E2E;
    --accent-hover:#E62727;
    --on-accent:#FFFFFF;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif;
    line-height:1.85;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .box{
    max-width:560px;
    width:100%;
    text-align:center;
  }

  .code{
    font-family:'Lalezar', 'IBM Plex Sans Arabic', sans-serif;
    font-size:clamp(88px, 22vw, 140px);
    line-height:1;
    color:var(--accent);
    margin:0 0 8px;
    letter-spacing:.02em;
  }

  .box h1{
    font-family:'Lalezar', 'IBM Plex Sans Arabic', sans-serif;
    font-weight:400;
    font-size:clamp(22px, 5vw, 30px);
    margin:0 0 12px;
    color:var(--text);
  }

  .box p{
    color:var(--text-muted);
    font-size:15.5px;
    margin:0 0 32px;
  }

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    font-weight:600;
    font-size:14.5px;
    padding:13px 24px;
    border-radius:10px;
    transition:opacity .15s ease, background-color .15s ease;
  }

  .btn-primary{
    background:var(--accent);
    color:var(--on-accent);
  }
  .btn-primary:hover{background:var(--accent-hover);}

  .btn-outline{
    background:transparent;
    color:var(--text);
    border:1.5px solid var(--line);
  }
  .btn-outline:hover{border-color:var(--accent); color:var(--accent);}

  .logo{
    margin-top:44px;
    font-family:'Lalezar', sans-serif;
    font-size:15px;
    color:var(--text-muted);
    letter-spacing:.03em;
  }
</style>
</head>
<body>

  <div class="box">
    <p class="code">404</p>
    <h1>الصفحة اللي بتدور عليها مش موجودة</h1>
    <p>يمكن الرابط اتغيّر أو اتكتب غلط. ارجع للصفحة الرئيسية أو كلّمني على طول.</p>

    <div class="actions">
      <a class="btn btn-primary" href="/">ارجع للرئيسية</a>
      <a class="btn btn-outline" href="https://wa.me/201554069372" target="_blank" rel="noopener">تواصل على واتساب</a>
    </div>

    <div class="logo">شريف السيسي</div>
  </div>

</body>
</html>
